name: Update Stock Monitor

on:
  workflow_dispatch:
  schedule:
    # 22:23 UTC = 18:23 EDT / 17:23 EST; after the US regular close.
    # Hong Kong: 06:23 Tuesday-Saturday. Trading holidays are handled in Python.
    - cron: "23 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-monitor-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pandas-market-calendars>=5.1,<6"

      - name: Run stock screener with strict daily-data validation
        run: python -u update_data.py

      # Default success() means these steps cannot publish after scanner failure.
      - name: Validate this run and commit fresh results
        env:
          TZ: UTC
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from update_data import latest_completed_session

          data = json.loads(Path("results.json").read_text(encoding="utf-8"))
          expected = latest_completed_session().strftime("%Y-%m-%d")
          validation = data.get("data_validation", {})
          if (validation.get("status") != "passed"
                  or validation.get("run_id") != os.environ["GITHUB_RUN_ID"]
                  or validation.get("run_attempt") != os.environ["GITHUB_RUN_ATTEMPT"]):
              raise SystemExit("ERROR: results were not validated by this run.")
          if data.get("data_as_of") != expected or data.get("benchmark_data_as_of") != expected:
              raise SystemExit(f"ERROR: stock/SPY data must be dated {expected}.")
          if any(row.get("data_as_of") != expected for row in data["results"]):
              raise SystemExit("ERROR: mismatched stock signal date.")
          print(f"Validated session {expected}; {len(data['results'])} matches.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto update stock screening results"
            git push
          fi
